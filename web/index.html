
<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ChainTodo - Blockchain Todo App">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ChainTodo">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>ChainTodo</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>

<script>
  // Menghubungkan MetaMask
  window.chainTodoConnect = async function () {
    if (!window.ethereum) {
      throw new Error('MetaMask tidak ditemukan');
    }

    const accounts = await window.ethereum.request({
      method: 'eth_requestAccounts'
    });

    if (!accounts || accounts.length === 0) {
      throw new Error('Wallet tidak ditemukan');
    }

    const chainId = await window.ethereum.request({
      method: 'eth_chainId'
    });

    if (chainId.toLowerCase() !== '0xaa36a7') {
      throw new Error('Silakan gunakan jaringan Sepolia');
    }

    return JSON.stringify({
      address: accounts[0],
      chainId: chainId
    });
  };

  // Mengirim transaksi smart contract
  window.chainTodoSendTransaction = async function (
    contractAddress,
    transactionData
  ) {
    if (!window.ethereum) {
      throw new Error('MetaMask tidak ditemukan');
    }

    const accounts = await window.ethereum.request({
      method: 'eth_accounts'
    });

    if (!accounts || accounts.length === 0) {
      throw new Error('Wallet belum terhubung');
    }

    const chainId = await window.ethereum.request({
      method: 'eth_chainId'
    });

    if (chainId.toLowerCase() !== '0xaa36a7') {
      throw new Error('Silakan gunakan jaringan Sepolia');
    }

    const transactionHash = await window.ethereum.request({
      method: 'eth_sendTransaction',
      params: [{
        from: accounts[0],
        to: contractAddress,
        data: transactionData
      }]
    });

    return transactionHash;
  };
</script>

<script src="flutter_bootstrap.js" async></script>

</body>
</html>
